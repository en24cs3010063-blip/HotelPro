services:
  - type: web
    name: hotelpro-backend
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGO_URI
        sync: false
